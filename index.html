<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050711">
<title>Trái tim Nguyễn Thu Phương</title>
<style>
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 50% 44%, #24070b 0%, #100408 47%, #020308 100%);
    color: #ffe6ea;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    touch-action: manipulation;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; width: 100%; height: 100%; }
  .title {
    position: fixed; z-index: 1; top: max(22px, env(safe-area-inset-top));
    left: 0; width: 100%; text-align: center; pointer-events: none;
    font-size: clamp(13px, 2.8vw, 17px); letter-spacing: .22em;
    color: rgba(255, 218, 224, .86); text-shadow: 0 0 18px #ff3558;
  }
  .hint {
    position: fixed; z-index: 1; left: 50%; bottom: max(22px, env(safe-area-inset-bottom));
    transform: translateX(-50%); white-space: nowrap; pointer-events: none;
    padding: 10px 16px; border: 1px solid rgba(255, 95, 116, .28);
    border-radius: 999px; background: rgba(35, 8, 14, .72);
    color: rgba(255, 224, 228, .82); font-size: 12px; letter-spacing: .04em;
    box-shadow: 0 0 24px rgba(255, 32, 64, .18);
  }
  .hint b { color: #ff91a2; font-weight: 600; }
</style>
</head>
<body>
<div class="title">DÀNH TẶNG NGUYỄN THU PHƯƠNG</div>
<canvas id="scene" aria-label="Trái tim đỏ phát sáng với chữ Nguyễn Thu Phương"></canvas>
<div class="hint">Chạm vào màn hình để <b>thả tim</b> ♥</div>
<script>
(() => {
  const canvas = document.getElementById("scene");
  const ctx = canvas.getContext("2d", { alpha: true });
  let w = 0, h = 0, dpr = 1, scale = 1, cx = 0, cy = 0;
  let words = [], sparks = [], bursts = [];
  const phrase = "Nguyễn Thu Phương";

  function insideHeart(x, y) {
    const a = x * x + y * y - 1;
    return a * a * a - x * x * y * y * y <= 0;
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const boxW = Math.min(w * 0.88, 540);
    const boxH = Math.min(h * 0.61, 500);
    scale = Math.min(boxW / 2.7, boxH / 2.45);
    cx = w * 0.5;
    cy = h * 0.49;

    words = [];
    const rowStep = 0.115;
    const colStep = 0.70;
    let row = 0;
    for (let y = -1.12; y <= 1.08; y += rowStep) {
      const offset = (row % 2) * colStep * 0.5;
      for (let x = -1.25 + offset; x <= 1.25; x += colStep) {
        if (!insideHeart(x, -y)) continue;
        words.push({
          x, y, phase: Math.random() * Math.PI * 2,
          speed: 0.65 + Math.random() * 1.2,
          alpha: 0.48 + Math.random() * 0.45,
          size: Math.max(8, Math.min(11, scale * 0.064)) + Math.random() * 1.2,
          shade: Math.random()
        });
      }
      row++;
    }

    sparks = Array.from({length: Math.max(35, Math.floor(w * h / 12500))}, () => ({
      x: Math.random() * w, y: Math.random() * h,
      r: 0.5 + Math.random() * 1.4, phase: Math.random() * 6.28,
      speed: 0.35 + Math.random() * 1.1
    }));
  }

  function drawHeartOutline(time) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(scale, scale);
    ctx.beginPath();
    for (let i = 0; i <= 260; i++) {
      const t = i / 260 * Math.PI * 2;
      const x = 16 * Math.pow(Math.sin(t), 3) / 17;
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) / 17;
      if (!i) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.lineWidth = 0.012;
    ctx.strokeStyle = "rgba(255, 55, 82, " + (0.20 + 0.08 * Math.sin(time * 0.0015)) + ")";
    ctx.shadowColor = "#ff1744";
    ctx.shadowBlur = 0.1;
    ctx.stroke();
    ctx.restore();
  }

  function frame(time) {
    ctx.clearRect(0, 0, w, h);

    for (const s of sparks) {
      const a = 0.16 + 0.34 * (0.5 + 0.5 * Math.sin(time * 0.001 * s.speed + s.phase));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255, 132, 150, " + a + ")";
      ctx.fill();
    }

    drawHeartOutline(time);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (const p of words) {
      const pulse = 0.5 + 0.5 * Math.sin(time * 0.001 * p.speed + p.phase);
      const drift = Math.sin(time * 0.00055 + p.phase) * 1.5;
      const x = cx + p.x * scale + drift;
      const y = cy + p.y * scale + Math.cos(time * 0.0007 + p.phase) * 1.2;
      const alpha = p.alpha * (0.58 + pulse * 0.42);
      ctx.font = "600 " + p.size + "px ui-monospace, 'Cascadia Code', Consolas, monospace";
      ctx.shadowColor = p.shade > 0.78 ? "#ffb1bb" : "#ff1744";
      ctx.shadowBlur = 5 + pulse * 9;
      const color = p.shade > 0.78 ? "255, 190, 198" : "255, 65, 91";
      ctx.fillStyle = "rgba(" + color + ", " + alpha + ")";
      ctx.fillText(phrase, x, y, scale * 0.68);
    }
    ctx.shadowBlur = 0;

    bursts = bursts.filter(p => p.life > 0);
    for (const p of bursts) {
      p.x += p.vx; p.y += p.vy; p.vy -= 0.012; p.life -= 0.012;
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.font = p.size + "px system-ui, sans-serif";
      ctx.shadowColor = "#ff3658"; ctx.shadowBlur = 12;
      ctx.fillText("♥", p.x, p.y);
      ctx.restore();
    }
    requestAnimationFrame(frame);
  }

  function burst(x, y) {
    for (let i = 0; i < 18; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 0.5 + Math.random() * 2.2;
      bursts.push({
        x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
        life: 0.8 + Math.random() * 0.8, size: 10 + Math.random() * 12
      });
    }
  }

  canvas.addEventListener("pointerdown", event => burst(event.clientX, event.clientY));
  window.addEventListener("resize", resize, { passive: true });
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
